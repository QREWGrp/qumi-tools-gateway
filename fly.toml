# fly.toml app configuration file generated for qumi-tools-gateway on 2026-11-12T16:48:46Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'qumi-tools-gateway'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  BIND_HOST = '0.0.0.0'
  MAX_GLOBAL_SESSIONS = '5'
  MAX_REQUESTS_PER_MINUTE = '60'
  MAX_SESSIONS_PER_IP = '5'
  MAX_SESSION_REQUESTS_PER_MINUTE = '30'
  PORT = '8080'
  SESSION_IDLE_MS = '600000'
  SESSION_MAX_AGE_MS = '1800000'
  TRUST_FLY_PROXY = '1'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 100
    soft_limit = 50

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/readyz'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
