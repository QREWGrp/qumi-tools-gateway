# Replace `app` with your real, available Fly.io app name before deploying.
# One Fly Machine, one region: session/IP caps are in-memory and per-instance.
app = "qumi-tools-gateway"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  BIND_HOST = "0.0.0.0"
  TRUST_FLY_PROXY = "1"
  MAX_SESSIONS_PER_IP = "5"
  MAX_GLOBAL_SESSIONS = "200"
  MAX_REQUESTS_PER_MINUTE = "60"
  MAX_SESSION_REQUESTS_PER_MINUTE = "30"
  SESSION_IDLE_MS = "600000"
  SESSION_MAX_AGE_MS = "1800000"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

# Internal Fly probes do not necessarily carry the public Host/Fly-Client-IP.
# The /healthz route deliberately has no IP-bound MCP session requirement.
[[http_service.checks]]
  grace_period = "15s"
  interval = "15s"
  method = "GET"
  timeout = "5s"
  path = "/healthz"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
